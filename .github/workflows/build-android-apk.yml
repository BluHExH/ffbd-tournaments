name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK with EAS
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK from EAS
        working-directory: mobile
        run: |
          mkdir -p artifacts
          eas build:download --latest --platform android --path ./artifacts/BANGLAR-TOURNAMENTS.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: Android APK build #${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: mobile/artifacts/BANGLAR-TOURNAMENTS.apk
