name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build Android APK with EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait 2>&1 | tee /tmp/eas-build.log
          BUILD_ID="$(grep -Eo 'builds/[0-9a-f-]{36}' /tmp/eas-build.log | tail -n 1 | cut -d/ -f2)"
          if [ -z "$BUILD_ID" ]; then
            echo "Could not find the completed EAS build ID in the build log."
            echo "Recent build log output:"
            tail -n 40 /tmp/eas-build.log
            exit 1
          fi
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Completed EAS build ID: $BUILD_ID"

      - name: Download APK from EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DOWNLOAD_JSON="$(npx --yes eas-cli@latest build:download --id "$EAS_BUILD_ID" --non-interactive --json)"
          APK_SOURCE="$(node -e 'const result = JSON.parse(process.argv[1]); if (!result.path) process.exit(1); process.stdout.write(result.path);' "$DOWNLOAD_JSON")"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" ./artifacts/BANGLAR-TOURNAMENTS.apk
          ls -lh ./artifacts/BANGLAR-TOURNAMENTS.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: "Android APK build #${{ github.run_number }}"
          prerelease: true
          make_latest: false
          files: mobile/artifacts/BANGLAR-TOURNAMENTS.apk
