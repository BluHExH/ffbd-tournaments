name: Build Android APK (Gradle)
# Tagged pushes and explicit build commits build the latest mobile source on the feature branch.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/common-admin-portal

permissions:
  contents: write

concurrency:
  group: android-gradle-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build signed Android APK with Gradle
    if: github.ref == 'refs/heads/feature/common-admin-portal' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Derive the next APK number from published Gradle APK release tags.
      # This prevents reusing APK-26 or overwriting an earlier release on later builds.
      - name: Set next APK release serial
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          latest="$(git tag --list 'android-gradle-apk-*' | sed -nE 's/^android-gradle-apk-([0-9]+)$/\1/p' | sort -n | tail -n 1)"
          next="$(( ${latest:-0} + 1 ))"
          echo "APK_SERIAL=$next" >> "$GITHUB_ENV"
          echo "Next APK release serial: $next"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Prepare app environment
        working-directory: mobile
        run: |
          node -e "const e=require('./eas.json').build.preview.env; for (const [k,v] of Object.entries(e)) console.log(k+'='+v)" >> "$GITHUB_ENV"

      - name: Generate padded Android launcher icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = Image.open("mobile/banglar-tournaments-app-icon.png").convert("RGBA")
          canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          artwork = source.copy()
          artwork.thumbnail((740, 740), Image.Resampling.LANCZOS)
          canvas.alpha_composite(artwork, ((1024 - artwork.width) // 2, (1024 - artwork.height) // 2))
          canvas.save("mobile/banglar-tournaments-app-icon-padded.png", optimize=True)
          PY

      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Follow docs/ANDROID-GRADLE-APK.md before running this workflow."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/upload-keystore.jks"
          test -s "$RUNNER_TEMP/android-signing/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Optimize Android release APK size
        working-directory: mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep only Android phone ABIs. x86/x86_64 are emulator architectures
          # and unnecessarily inflate a single universal APK for end users.
          gradle_properties = Path("android/gradle.properties")
          properties = gradle_properties.read_text() if gradle_properties.exists() else ""
          settings = {
              "reactNativeArchitectures": "arm64-v8a,armeabi-v7a",
              "android.enableMinifyInReleaseBuilds": "true",
              "android.enableShrinkResourcesInReleaseBuilds": "true",
              "android.enablePngCrunchInReleaseBuilds": "true",
          }
          lines = [line for line in properties.splitlines()
                   if not any(line.strip().startswith(key + "=") for key in settings)]
          lines.extend(f"{key}={value}" for key, value in settings.items())
          gradle_properties.write_text("\\n".join(lines) + "\\n")
          print("Enabled R8 minification, resource shrinking, PNG crunching, and ARM-only APK ABIs.")
          PY

      - name: Add Maven Central mirror for Gradle plugin dependencies
        working-directory: mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle")
          text = path.read_text()
          match = re.search(r"pluginManagement\s*\{", text)
          if not match:
              raise SystemExit("Generated settings.gradle has no pluginManagement block")

          # Add an early repository block directly inside pluginManagement.
          # This works whether or not Expo already generated a repositories block.
          mirror_block = """
              repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2" }
                  maven { url "https://maven.aliyun.com/repository/central" }
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          """
          if "https://maven.aliyun.com/repository/central" not in text:
              insert_at = match.end()
              text = text[:insert_at] + "\n" + mirror_block + text[insert_at:]
              path.write_text(text)
          print("Configured the Maven Central mirror in pluginManagement.repositories.")
          PY

      - name: Configure release signing
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "signingConfigs {" not in text or "buildTypes {" not in text:
              raise SystemExit("Unexpected Expo-generated Gradle layout; refusing to create an incorrectly signed APK.")

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          text = text.replace("    buildTypes {", signing + "    buildTypes {", 1)
          build_types = text.find("    buildTypes {")
          if build_types < 0:
              raise SystemExit("Could not locate buildTypes in generated Gradle file.")
          before, after = text[:build_types], text[build_types:]
          release_start = after.find("release {")
          debug_signing = after.find("signingConfig signingConfigs.debug", release_start)
          if release_start < 0 or debug_signing < 0:
              raise SystemExit("Could not configure release signing in generated Gradle file; refusing an unsigned/debug-signed release.")
          after = after[:debug_signing] + "signingConfig signingConfigs.release" + after[debug_signing + len("signingConfig signingConfigs.debug"):]
          text = before + after
          path.write_text(text)
          PY

      - name: Build release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew --no-daemon :app:assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Gradle dependency/build request failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Verify APK signature and package
        working-directory: mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          if [ "$PACKAGE_ID" != "com.banglartournaments.app" ]; then
            echo "::error::Unexpected APK package ID: $PACKAGE_ID"
            exit 1
          fi
          echo "Verified Android package ID: $PACKAGE_ID"
          mkdir -p artifacts
          APK_NAME="BANGLAR-TOURNAMENTS-APK-${APK_SERIAL}.apk"
          cp "$APK" "artifacts/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          ls -lh "artifacts/$APK_NAME"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-gradle-apk-${{ env.APK_SERIAL }}
          name: "Android Gradle APK build #${{ env.APK_SERIAL }}"
          prerelease: true
          make_latest: false
          files: mobile/artifacts/${{ env.APK_NAME }}
