name: Build Android APK (Gradle)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-gradle-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build signed Android APK with Gradle
    if: github.ref == 'refs/heads/feature/common-admin-portal'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Prepare app environment
        working-directory: mobile
        run: |
          node -e "const e=require('./eas.json').build.preview.env; for (const [k,v] of Object.entries(e)) console.log(k+'='+v)" >> "$GITHUB_ENV"

      - name: Generate padded Android launcher icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          source = Image.open("mobile/banglar-tournaments-app-icon.png").convert("RGBA")
          canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          artwork = source.copy()
          artwork.thumbnail((740, 740), Image.Resampling.LANCZOS)
          canvas.alpha_composite(artwork, ((1024 - artwork.width) // 2, (1024 - artwork.height) // 2))
          canvas.save("mobile/banglar-tournaments-app-icon-padded.png", optimize=True)
          PY

      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Follow docs/ANDROID-GRADLE-APK.md before running this workflow."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/upload-keystore.jks"
          test -s "$RUNNER_TEMP/android-signing/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure release signing
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "signingConfigs {" not in text or "buildTypes {" not in text:
              raise SystemExit("Unexpected Expo-generated Gradle layout; refusing to create an incorrectly signed APK.")

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """
          text = text.replace("    buildTypes {", signing + "    buildTypes {", 1)
          match = re.search(r"(release\\s*\\{[\\s\\S]*?signingConfig\\s+)signingConfigs\\.debug", text)
          if not match:
              raise SystemExit("Could not locate release signingConfig in generated Gradle file; refusing an unsigned/debug-signed release.")
          text = text[:match.start()] + match.group(1) + "signingConfigs.release" + text[match.end():]
          path.write_text(text)
          PY

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature and package
        working-directory: mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p artifacts
          APK_NAME="BANGLAR-TOURNAMENTS-APK-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "artifacts/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          ls -lh "artifacts/$APK_NAME"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-gradle-apk-${{ github.run_number }}
          name: "Android Gradle APK build #${{ github.run_number }}"
          prerelease: true
          make_latest: false
          files: mobile/artifacts/${{ env.APK_NAME }}
